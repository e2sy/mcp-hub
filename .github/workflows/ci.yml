name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install website dependencies
        run: bun install

      - name: Lint website
        run: bun run lint

      - name: Setup database
        run: |
          bun run db:push
          bun run scripts/seed.ts

      - name: Export registry
        run: bun run scripts/export-registry.ts

      - name: Build CLI
        run: |
          cd cli
          bun install
          bun run build

      - name: Lint CLI
        run: |
          cd cli
          bun run lint

      - name: Run smoke tests
        run: |
          cd cli
          bun run test

      - name: Verify CLI works
        run: |
          cd cli
          node dist/index.js --version
          node dist/index.js list --featured
          node dist/index.js info github

  build-website:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup database
        run: |
          bun run db:push
          bun run scripts/seed.ts

      - name: Build
        run: bun run build
        env:
          SKIP_ENV_VALIDATION: true
