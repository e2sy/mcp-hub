name: Auto-discover MCP servers

on:
  schedule:
    # Every Friday at 09:00 UTC
    - cron: '0 9 * * 5'
  workflow_dispatch:

jobs:
  discover:
    name: Search for new MCP servers on GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup database
        run: |
          bun run db:push
          bun run scripts/seed.ts

      - name: Search GitHub for MCP servers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run scripts/discover-servers.ts

      - name: Create pull request with discovered servers
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'feat: auto-discover new MCP servers'
          title: 'Auto-discovered MCP servers'
          body: |
            ## Auto-discovered MCP servers

            This PR contains MCP servers found by scanning GitHub for repositories matching MCP server patterns.

            ### Review checklist
            - [ ] Each server is a real, working MCP server
            - [ ] Each server has a working install command
            - [ ] Config JSON is valid
            - [ ] No duplicates with existing entries

            Generated by the `Auto-discover MCP servers` GitHub Action.
          branch: auto/discover
          delete-branch: true
