name: Sync GitHub Stars

on:
  schedule:
    # Every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  sync:
    name: Sync star counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup database
        run: |
          bun run db:push
          bun run scripts/seed.ts

      - name: Sync stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run scripts/sync-stars.ts

      - name: Export registry
        run: bun run scripts/export-registry.ts

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'data: sync GitHub star counts'
          title: 'Weekly star sync'
          body: |
            Automated weekly sync of GitHub star counts for all MCP servers in the directory.

            Generated by the `Sync GitHub Stars` GitHub Action.
          branch: data/star-sync
          delete-branch: true
